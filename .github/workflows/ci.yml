name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Known-vulnerability audit
        run: composer audit --no-interaction
      - name: Tests
        run: composer test

      # Supply-chain gate (same script as origamy-control-plane): flags code
      # hidden behind long whitespace runs, the GlassWorm payload marker, and
      # "fonts" that are really scripts.
      - name: Hidden-code / masqueraded-payload scan
        run: ./scripts/check-hidden-code.sh .
